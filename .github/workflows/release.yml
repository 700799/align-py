name: Release

on:
  # Dry run by default: builds and checks the distributions without uploading,
  # so you can inspect the artifact before committing to a version number.
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to PyPI (unchecked = build and check only)"
        required: true
        default: false
        type: boolean
  # Real release: push a tag like v0.1.0.
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build & check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # A mistagged release must never reach an index: version numbers are
      # permanent once uploaded, so fail before building instead.
      - name: Verify tag matches __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg_version=$(python -c "import re,pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('alignpy/__init__.py').read_text()).group(1))")
          tag_version="${GITHUB_REF_NAME#v}"
          echo "tag=$tag_version package=$pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $pkg_version"
            exit 1
          fi

      - run: pip install build twine
      - run: python -m build
      # --strict fails on a README that would not render on the index.
      - run: twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    # Gate on a protected environment so the token is only readable here and a
    # human has to approve the release.
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
