name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast:
    name: Schema & CLI tests (no ML deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pydantic pyyaml pytest
      # Torch-dependent tests self-skip via importorskip in this lane.
      - run: pytest -m "not integration" -q

  integration:
    name: End-to-end DPO (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-smollm2-135m-instruct-v1
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      # Full suite: schema/CLI tests, the offline tiny-model DPO run, and the
      # SmolLM2-135M end-to-end run (auto-skips only if the HF Hub is unreachable).
      - run: pytest -q -rs
